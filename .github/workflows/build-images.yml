name: Build & publish app images

# Baut das Docker-Image fuer den Zano-Node (Basis: offizielles
# zanoproject/zano-full-node-Image + torsocks-Layer) und die
# Status-Weboberflaeche, und veroeffentlicht beide auf ghcr.io, damit
# docker-compose.yml in cryptonode-zano/ sie referenzieren kann.
#
# Voraussetzung: In den Repo-Einstellungen unter Settings > Actions >
# General > Workflow permissions muss "Read and write permissions" aktiv
# sein, damit der automatische GITHUB_TOKEN nach ghcr.io pushen darf.

on:
  push:
    branches: [main, master]
    paths:
      - "cryptonode-zano/Dockerfile"
      - "cryptonode-zano/docker-entrypoint.sh"
      - "cryptonode-zano/status/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-zano-node:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Repo-Namen in Kleinbuchstaben ermitteln (ghcr.io verlangt das)
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./cryptonode-zano
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/zano-node:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/zano-node:2.2.1.502

  build-zano-status:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Repo-Namen in Kleinbuchstaben ermitteln
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./cryptonode-zano/status
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/zano-status:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/zano-status:1.0.0
