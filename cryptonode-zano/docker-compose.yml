version: "3.7"

# WICHTIG: Ersetze überall "OWNER/REPO" durch deinen GitHub-Benutzernamen und
# den Namen dieses Repos (z.B. "max/umbrel-community-store"), NACHDEM du das
# Repo auf GitHub erstellt hast und die Actions-Workflows einmal gelaufen sind.
# Die Actions bauen die Images automatisch und veröffentlichen sie unter genau
# diesem Pfad auf ghcr.io.

services:

  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: cryptonode-zano_web_1
      APP_PORT: 5000

  # Kleine Status-Weboberfläche (Höhe, Peers, Tor-Status). Sie spricht den
  # zanod-RPC-Port nur intern an, nie direkt über app_proxy.
  web:
    image: ghcr.io/OWNER/REPO/zano-status:1.0.0
    user: "1000:1000"
    restart: on-failure
    environment:
      ZANO_RPC_HOST: cryptonode-zano_zanod_1
      ZANO_RPC_PORT: "11211"
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
    depends_on:
      - zanod

  # Der eigentliche Zano-Daemon. Kein Host-Port wird published - RPC ist nur
  # innerhalb des Umbrel-Docker-Netzes für den "web"-Service erreichbar.
  zanod:
    image: ghcr.io/OWNER/REPO/zano-node:2.1.17.469
    restart: on-failure
    init: true
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/zano:/data
    environment:
      # Umbrels eingebauter Tor-SOCKS-Proxy - wird per torsocks im Entrypoint
      # genutzt, um den gesamten ausgehenden P2P-Verkehr zu anonymisieren.
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
      ZANO_RPC_PORT: "11211"
      ZANO_P2P_PORT: "11121"
