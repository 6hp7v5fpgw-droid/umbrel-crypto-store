version: "3.7"

# Basiert auf dem offiziellen zanoproject/zano-full-node-Image (siehe
# Dockerfile), ergaenzt nur um torsocks fuer Tor-Routing. Die Images werden
# per GitHub Actions (.github/workflows/build-images.yml) gebaut und unter
# ghcr.io/6hp7v5fpgw-droid/umbrel-crypto-store veroeffentlicht.

services:

  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: cryptonode-zano_web_1
      APP_PORT: 5000

  # Kleine Status-Weboberflaeche (Hoehe, Peers, Tor-Status). Sie spricht den
  # zanod-RPC-Port nur intern an, nie direkt ueber app_proxy.
  web:
    image: ghcr.io/6hp7v5fpgw-droid/umbrel-crypto-store/zano-status:1.0.0
    user: "1000:1000"
    restart: on-failure
    environment:
      ZANO_RPC_HOST: cryptonode-zano_zanod_1
      ZANO_RPC_PORT: "11211"
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
    depends_on:
      - zanod

  # Der eigentliche Zano-Daemon (offizielles Image + torsocks-Layer). Kein
  # Host-Port wird published - RPC ist nur innerhalb des Umbrel-Docker-Netzes
  # fuer den "web"-Service erreichbar.
  zanod:
    image: ghcr.io/6hp7v5fpgw-droid/umbrel-crypto-store/zano-node:2.2.1.502
    restart: on-failure
    init: true
    volumes:
      - ${APP_DATA_DIR}/data/zano:/home/zano/.Zano
    environment:
      # Umbrels eingebauter Tor-SOCKS-Proxy - wird per torsocks im Entrypoint
      # genutzt, um den gesamten ausgehenden P2P-Verkehr zu anonymisieren.
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
      ZANO_RPC_PORT: "11211"
      ZANO_P2P_PORT: "11121"
