id: cryptonode-zano
category: Crypto
name: Zano Node
version: "v2.2.1.502"
tagline: Voll validierender Zano-Knoten, dessen P2P-Verkehr über Tor läuft
description: >-
  Betreibt einen eigenen, voll validierenden Knoten für Zano (ZANO), eine
  CryptoNote-basierte Privacy-Coin. Der Daemon (zanod) wird aus dem
  Quellcode gebaut und läuft in dieser Paketierung standardmäßig als
  ausgehend-nur-Tor-Knoten: der gesamte P2P-Traffic wird per torsocks über
  Umbrels eingebauten Tor-SOCKS-Proxy geleitet, sodass dein Knoten seine
  echte IP-Adresse nicht an andere Peers im Netzwerk preisgibt.


  Aktiviere zusätzlich in den Umbrel-Einstellungen unter "Remote Tor Access"
  eine .onion-Adresse für diese App, wenn du auch die Status-Seite bzw. das
  RPC-Interface anonym von unterwegs erreichen willst.


  Wichtig: Dieser Knoten akzeptiert bewusst keine eingehenden P2P-Verbindungen
  (p2p-bind auf localhost, hide-my-port aktiv). Er ist als privater Knoten für
  deine eigene Wallet gedacht, nicht als öffentlicher Relay-Knoten für das
  Zano-Netzwerk.


  - Baut zanod + simplewallet direkt aus dem offiziellen hyle-team/zano Repo

  - P2P-Traffic wird via torsocks über den Umbrel-Tor-Proxy geroutet

  - RPC-Port ist nur intern (nicht auf den Host published) erreichbar

  - Blockchain- und Log-Daten liegen persistent unter dem App-Datenverzeichnis
