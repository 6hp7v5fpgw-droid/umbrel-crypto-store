id: zano-node
category: finance
name: Zano Node
version: 1.0.0
release_notes: Private Zano Full Node über Tor mit Wallet-RPC

description:
  short: Zano Full Node mit Tor
  long: >
    Betreibe einen Zano Full Node vollständig über das Tor-Netzwerk.
    Zano ist eine datenschutzorientierte Kryptowährung mit unteilbaren Münzen (Atomare Einheit).
    RPC erreichbar über .onion-Adresse für Zano Wallet CLI, Desktop-Wallet.
    Pruned Mode für Speichereffizienz.

repo: https://github.com/hyle-team/zano
support: https://github.com/hyle-team/zano/issues

containers:
  - name: tor
    image: alpine:3.19
  - name: zano
    image: zanohq/zano:latest

metadata:
  name: Zano Node
  version: "1.0"
  tagline: Privacy Blockchain
  description: Zano Full Node mit Tor-Integration und Wallet-RPC
